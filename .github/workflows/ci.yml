name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 在 Windows 与 Linux 上各跑一遍 CI：包构建路径（路径分隔符、native module）
        # 在两个平台都得过，VSCode 扩展本体的运行时兼容性是 macOS/Linux 同样的 Node 16+
        # 抽象层保证，开发期验证 Windows 与 Linux 已覆盖 90% 失败面。
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # No --if-present here: every one of these scripts exists, and a missing
      # script should break the build rather than be silently skipped.
      - run: bun run type-check
      - run: bun test
      - run: bun run build
