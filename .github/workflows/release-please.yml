name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发重跑

permissions:
  contents: write       # 推送版本变更提交与 Git 标签
  pull-requests: write  # 开/更新 Release PR
  id-token: write       # npm provenance (即使走 token 也要)

jobs:
  release-please:
    name:  Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4 # v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      - name: 打印 release-please 输出（便于排查）
        if: ${{ always() }}
        env:
          RP_OUT: ${{ toJson(steps.release.outputs) }}
        run: echo "$RP_OUT"


  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC for npm provenance
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Test
        run: bun test

      - name: 编译全部包
        run: bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMTOKEN }}
