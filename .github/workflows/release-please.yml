name: release-please

# release-please 监听 main 推送，自动检测 conventional commits 开/更新 Release PR。
# Release PR 合并时，release-please 会：
#   1) 为每个有变更的包打 tag（格式: <package>-v${version}）
#   2) 创建 GitHub release
#   3) 更新 .github/.release-please-manifest.json
#   4) 更新对应 packages/*/package.json + CHANGELOG.md
#   5) **自动 npm publish**（前提：config-file 里有 `packages` block）
#
# 所以 step `Release please` 直接吃 NPM_TOKEN 去 publish；
# 我们这里**不再**写手动 publish step，否则会双发。
#
# token 放在 https://github.com/eastgold15/vscode-plugin/settings/secrets/actions 里，
# 名字: NPMTOKEN，值: `npm token create` 生成的 publish token（需 Bypass 2FA）。
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发重跑

permissions:
  contents: write       # 推送版本变更提交与 Git 标签
  pull-requests: write  # 开/更新 Release PR
  id-token: write       # npm provenance (即使走 token 也要)

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7

      - name: 装 bun
        uses: oven-sh/setup-bun@v2 # v2
        with:
          bun-version: "1.3"

      - name: 装 node（给 release-please 内置的 npm publish 用）
        uses: actions/setup-node@v4 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # 编译产物：release-please 不会跑 build，但 publish 之前 dist/ 必须在。
      # 每次 push 都要编一遍，build 是 turbo 自带缓存所以不慢。
      - name: 编译全部包
        run: bun run build

      - name: Release please
        uses: googleapis/release-please-action@v4 # v4
        id: release
        env:
          NPM_TOKEN: ${{ secrets.NPMTOKEN }}
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: 打印 release-please 输出（便于排查）
        if: ${{ always() }}
        env:
          RP_OUT: ${{ toJson(steps.release.outputs) }}
        run: echo "$RP_OUT"
