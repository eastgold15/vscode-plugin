name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发重跑

permissions:
  contents: write       # 推送版本变更提交与 Git 标签
  pull-requests: write  # 开/更新 Release PR
  id-token: write       # npm provenance (即使走 token 也要)

jobs:
  release-please:
    name:  Release PR
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{steps.release.outputs.paths_released}}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      - name: 打印 release-please 输出（便于排查）
        if: ${{ always() }}
        env:
          RP_OUT: ${{ toJson(steps.release.outputs) }}
        run: echo "$RP_OUT"
  publish:
     name: Publish to npm
     needs: release-please
     if: ${{ needs.release-please.outputs.releases_created == 'true' }}
     runs-on: ubuntu-latest
     permissions:
       id-token: write
     steps:
       - uses: actions/checkout@v7

       - uses: oven-sh/setup-bun@v2
         with:
           bun-version: latest

       - uses: actions/setup-node@v7
         with:
           node-version: 24
           registry-url: 'https://registry.npmjs.org'
           package-manager-cache: false

       - name: Install dependencies
         run: bun install --frozen-lockfile

       - name: Build all packages
         run: bun run build

       - name: Publish released packages
         run: |
           PATHS_RELEASED='${{ needs.release-please.outputs.paths_released }}'
           echo "📋 Released paths: $PATHS_RELEASED"

           # 检查是否有包要发布
           if [ "$PATHS_RELEASED" = "[]" ] || [ -z "$PATHS_RELEASED" ]; then
             echo "⚠️ No packages to publish"
             exit 0
           fi

           for pkg in $(echo "$PATHS_RELEASED" | jq -r '.[]'); do
             echo "📦 Publishing $pkg..."
             cd "$pkg"
             npm publish --provenance --access public
             cd -
           done
         env:
           NODE_AUTH_TOKEN: ${{ secrets.NPMTOKEN }}